version: '3.8'

services:
  # --- Backend Application ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: talentforge-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/talentforge?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_URL=http://opensearch:9200
      - FRONTEND_URL=http://localhost:5173
    env_file:
      - src/config/.env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - talentforge-network

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: talentforge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talentforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talentforge-network

  # --- Redis (BullMQ / Queue / Caching) ---
  redis:
    image: redis:7-alpine
    container_name: talentforge-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talentforge-network

  # --- OpenSearch ---
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: talentforge-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - talentforge-network

volumes:
  pgdata:
  redisdata:
  opensearchdata:

networks:
  talentforge-network:
    driver: bridge
