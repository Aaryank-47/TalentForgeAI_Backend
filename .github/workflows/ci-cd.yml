name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentforge_test?schema=public

      - name: TypeScript Type-Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          PORT: "3000"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentforge_test?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_1234567890
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_1234567890
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          GMAIL_USER: ci-test@talentforge.ai
          GMAIL_PASS: ci-test-password-1234
          RESET_PASSWORD_SECRET: test_reset_password_secret_1234
          RESET_PASSWORD_EXPIRES_IN: 1h
          CLOUDINARY_API_KEY: "111111111111111"
          CLOUDINARY_API_SECRET: test_cloudinary_api_secret_1234
          CLOUDINARY_CLOUD_NAME: test_cloudinary_cloud
          INVITATION_TOKEN_SECRET: test_invitation_token_secret_123
          INVITATION_TOKEN_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
          ELASTICSEARCH_URL: http://localhost:9200
          OPENROUTER_API_KEY: sk-or-v1-test-ci-key-0000000000000000
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENROUTER_MODEL: test/model
          OPENROUTER_TIMEOUT_MS: "30000"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          RESUME_WORKER_CONCURRENCY: "2"
          RESUME_JOB_ATTEMPTS: "3"
          RESUME_JOB_BACKOFF_DELAY_MS: "5000"
          RESEND_API_KEY: "test_resend_api_key_12345"

      - name: Build TypeScript Application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image on GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "Verifying image manifest for $IMAGE_TAG"
          docker buildx imagetools inspect "$IMAGE_TAG"
