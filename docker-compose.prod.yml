version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: talentforge-backend-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - REDIS_FALLBACK_URLS=${REDIS_FALLBACK_URLS}
    networks:
      - talentforge-network

networks:
  talentforge-network:
    driver: bridge
